        activeProjects:
          type: integer
        completedProjects:
          type: integer
        totalBudget:
          type: number
        totalActualSpend:
          type: number
        onTrackCount:
          type: integer
        delayedCount:
          type: integer
      required: [totalProjects, activeProjects, completedProjects, totalBudget, totalActualSpend, onTrackCount, delayedCount]

    AgingSummary:
      type: object
      properties:
        current:
          type: number
        overdue30:
          type: number
        overdue60:
          type: number
        overdue90Plus:
          type: number
        totalOutstanding:
          type: number
      required: [current, overdue30, overdue60, overdue90Plus, totalOutstanding]

    # ── LEADS ─────────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, source, status, createdAt]
      properties:
        id:
          type: integer
        source:
          type: string
        ownerId:
          type: ["integer", "null"]
        ownerName:
          type: ["string", "null"]
        territory:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        productInterest:
          type: ["string", "null"]
        estimatedValue:
          type: ["number", "null"]
        score:
