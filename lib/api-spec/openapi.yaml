        companyName:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        territory:
          type: string
        productInterest:
          type: string
        estimatedValue:
          type: number
        status:
          type: string
        notes:
          type: string

    LeadUpdate:
