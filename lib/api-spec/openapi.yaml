      operationId: submitProcInvoice
      tags: [proc-invoices]
      summary: Submit invoice for approval
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionInput"
      responses:
        "200":
          description: Submitted invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcInvoice"

  /proc-invoices/{id}/approve-mismatch:
    post:
      operationId: approveProcInvoiceMismatch
      tags: [proc-invoices]
      summary: Approve 3-way match mismatch
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionInput"
      responses:
        "200":
          description: Mismatch approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcInvoice"

  /proc-invoices/{id}/approve:
    post:
      operationId: approveProcInvoice
      tags: [proc-invoices]
      summary: Approve invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionInput"
      responses:
        "200":
          description: Approved invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcInvoice"

  /proc-invoices/{id}/reject:
    post:
      operationId: rejectProcInvoice
      tags: [proc-invoices]
      summary: Reject invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionInput"
      responses:
        "200":
          description: Rejected invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcInvoice"

  /proc-invoices/{id}/mark-paid:
    post:
      operationId: markProcInvoicePaid
      tags: [proc-invoices]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionInput"
      responses:
        "200":
          description: Invoice marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcInvoice"

  # ── DISPATCH RECORDING ───────────────────────────────────────────────────────
  /procurement-pos/{id}/record-dispatch:
    post:
      operationId: recordProcurementPODispatch
      tags: [proc-pos]
      summary: Record vendor dispatch info on PO
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PODispatchInput"
      responses:
        "200":
          description: Updated PO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPO"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ── AUTH ─────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        orgId:
          type: integer

    # ── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardData:
      type: object
      properties:
        role:
          type: string
        leadsCount:
          type: integer
        activeProjectsCount:
          type: integer
        pendingApprovalsCount:
          type: integer
        overdueTasksCount:
          type: integer
        totalContractValue:
          type: number
        invoiceOutstanding:
          type: number
        recentLeads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        openEscalations:
          type: array
          items:
            $ref: "#/components/schemas/Escalation"

    CombinedDashboardData:
      type: object
      properties:
        pipeline:
          $ref: "#/components/schemas/PipelineSummary"
        portfolioSummary:
          $ref: "#/components/schemas/PortfolioSummary"
        recentDPRs:
          type: array
          items:
            $ref: "#/components/schemas/DPR"
        pendingMilestones:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMilestone"
        openEscalations:
          type: array
          items:
            $ref: "#/components/schemas/Escalation"

    PipelineSummary:
      type: object
