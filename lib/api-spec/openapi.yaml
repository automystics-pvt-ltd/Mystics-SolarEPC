openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mystics ERP API — Sales & CRM, Project Management, Inventory & Warehouse Management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Role-based dashboards
  - name: leads
    description: Sales & CRM — Leads
  - name: quotations
    description: Sales & CRM — Quotations
  - name: client-pos
    description: Sales & CRM — Client Purchase Orders
  - name: crm-invoices
    description: Sales & CRM — Invoices
  - name: tasks
    description: Tasks across modules
  - name: escalations
    description: Escalations across modules
  - name: projects
    description: Project Management — Projects
  - name: activities
    description: Project Management — Activities & Gantt
  - name: material-requests
    description: Project Management — Material Requests
  - name: vendor-quotations
    description: Project Management — Vendor Quotations
  - name: purchase-orders
    description: Project Management — Purchase Orders
  - name: dprs
    description: Project Management — Daily Progress Reports
  - name: milestones
    description: Project Management — Payment Milestones
  - name: expenses
    description: Project Management — Expenses
  - name: budgets
    description: Project Management — Budgets
  - name: contractors
    description: Project Management — Contractors
  - name: engineering
    description: Engineering & Design — Documents and approvals
  - name: commissioning
    description: Stage 7 — Commissioning & Handover
  - name: oam
    description: Stage 8 — O&M & AMC
  - name: site-surveys
    description: Stage 1 — Site Surveys
  - name: snags
    description: Stage 6 — Snag Logs
  - name: warehouses
    description: Inventory — Warehouses
  - name: grns
    description: Inventory — Goods Receipt Notes
  - name: delivery-challans
    description: Inventory — Delivery Challans
  - name: stock
    description: Inventory — Stock Ledger & Valuation
  - name: inventory-audits
    description: Inventory — Audits
  - name: vendors
    description: Procurement — Vendor Master
  - name: materials
    description: Procurement — Material Master
  - name: proc-quotations
    description: Procurement — Vendor Quotation Workflow
  - name: proc-pos
    description: Procurement — Purchase Orders (from approved quotations)
  - name: proc-grns
    description: Procurement — Goods Receipt Notes
  - name: proc-invoices
    description: Procurement — Vendor Invoices (3-way match)
  - name: proc-dashboard
    description: Procurement — Dashboard & Analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Role-based home dashboard KPIs
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /dashboard/combined:
    get:
      operationId: getCombinedDashboard
      tags: [dashboard]
      summary: Combined CRM + Project dashboard
      responses:
        "200":
          description: Combined dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombinedDashboardData"

  # ── LEADS ──────────────────────────────────────────────────────────────────
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List and filter leads
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: owner
          in: query
          schema:
            type: string
        - name: territory
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /leads/{id}/assign:
    post:
      operationId: assignLead
      tags: [leads]
      summary: Assign lead and compute score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadAssignInput"
      responses:
        "200":
          description: Lead assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/pipeline-summary:
    get:
      operationId: getLeadsPipelineSummary
      tags: [leads]
      summary: Pipeline summary — count and value by stage
      responses:
        "200":
          description: Pipeline summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSummary"

  # ── QUOTATIONS ─────────────────────────────────────────────────────────────
  /quotations:
    get:
      operationId: getQuotations
      tags: [quotations]
      summary: List quotations
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: leadId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Quotations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Create a quotation against a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: Get a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: Update a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/approve:
    post:
      operationId: approveQuotation
      tags: [quotations]
      summary: Approve a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}/log-client-po:
    post:
      operationId: logClientPO
      tags: [quotations]
      summary: Log client PO and auto-create project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPOInput"
      responses:
        "201":
          description: Client PO logged and project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPOWithProject"

  # ── CLIENT POs ─────────────────────────────────────────────────────────────
  /client-pos:
    get:
      operationId: getClientPOs
      tags: [client-pos]
      summary: List client POs
      responses:
        "200":
          description: Client POs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientPO"

  /client-pos/{id}:
    get:
      operationId: getClientPO
      tags: [client-pos]
      summary: Get a client PO
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client PO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPO"

  # ── CRM INVOICES ───────────────────────────────────────────────────────────
  /crm-invoices:
    get:
      operationId: getCrmInvoices
      tags: [crm-invoices]
      summary: List CRM invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: clientPoId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmInvoice"
    post:
      operationId: createCrmInvoice
      tags: [crm-invoices]
      summary: Create a client invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmInvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmInvoice"

  /crm-invoices/{id}/mark-paid:
    post:
      operationId: markCrmInvoicePaid
      tags: [crm-invoices]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaidInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmInvoice"

  /crm-invoices/aging-summary:
    get:
      operationId: getInvoiceAgingSummary
      tags: [crm-invoices]
      summary: Invoice aging summary — overdue buckets
      responses:
        "200":
          description: Aging summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingSummary"

  # ── TASKS ──────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: module
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  # ── ESCALATIONS ────────────────────────────────────────────────────────────
  /escalations:
    get:
      operationId: getEscalations
      tags: [escalations]
      summary: List escalations
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: integer
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Escalation"
    post:
      operationId: createEscalation
      tags: [escalations]
      summary: Raise an escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /escalations/{id}/resolve:
    post:
      operationId: resolveEscalation
      tags: [escalations]
      summary: Resolve an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveEscalationInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  # ── PROJECTS ───────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: pmOwnerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}/dashboard:
    get:
      operationId: getProjectDashboard
      tags: [projects]
      summary: Single-project KPI dashboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDashboard"

  /projects/{id}/budget-vs-actual:
    get:
      operationId: getProjectBudgetVsActual
      tags: [projects]
      summary: Budget vs actual for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Budget variance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetVsActual"

  /projects/portfolio-summary:
    get:
      operationId: getPortfolioSummary
      tags: [projects]
      summary: Portfolio-level summary across all projects
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  # ── ACTIVITIES (GANTT) ─────────────────────────────────────────────────────
  /projects/{id}/activities:
    get:
      operationId: getProjectActivities
      tags: [activities]
      summary: Get activities / Gantt data for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Add activity to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  # ── MATERIAL REQUESTS ──────────────────────────────────────────────────────
  /material-requests:
    get:
      operationId: getMaterialRequests
      tags: [material-requests]
      summary: List material requests
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Material requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialRequest"
    post:
      operationId: createMaterialRequest
      tags: [material-requests]
      summary: Raise a material request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRequest"

  /material-requests/{id}:
    get:
      operationId: getMaterialRequest
      tags: [material-requests]
      summary: Get a material request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRequest"

  /material-requests/{id}/vendor-quotations:
    post:
      operationId: addVendorQuotation
      tags: [material-requests]
      summary: Add a vendor quotation to a material request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuotationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuotation"

  # ── VENDOR QUOTATIONS ──────────────────────────────────────────────────────
  /vendor-quotations:
    get:
      operationId: getVendorQuotations
      tags: [vendor-quotations]
      summary: List vendor quotations
      parameters:
        - name: mrId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Vendor quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorQuotation"

  /vendor-quotations/{id}/review:
    post:
      operationId: reviewVendorQuotation
      tags: [vendor-quotations]
      summary: Submit manager/MD review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuotationReviewInput"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuotation"

  /vendor-quotations/{id}/approve-l1:
    post:
      operationId: approveVendorQuotationL1
      tags: [vendor-quotations]
      summary: L1 approval on a vendor quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L1ApprovalInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuotation"

  /vendor-quotations/{id}/generate-po:
    post:
      operationId: generatePOFromQuotation
      tags: [vendor-quotations]
      summary: Generate PO from L1-approved vendor quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePOInput"
      responses:
        "201":
          description: PO created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  # ── PURCHASE ORDERS ────────────────────────────────────────────────────────
  /purchase-orders:
    get:
      operationId: getPurchaseOrders
      tags: [purchase-orders]
      summary: List purchase orders
      parameters:
        - name: projectId
          in: query
          schema:
