# Nginx config — Mystics ERP
# Place at /etc/nginx/sites-available/mystics and symlink to /etc/nginx/sites-enabled/
#
# Assumes:
#   - API server running on localhost:8080 (PM2 / systemd)
#   - Frontend static build at /opt/mystics/artifacts/erp/dist/public
#   - SSL certificates managed by Certbot (Let's Encrypt)
#
# To enable:
#   sudo ln -s /etc/nginx/sites-available/mystics /etc/nginx/sites-enabled/mystics
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Let Certbot handle its ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yourdomain.com;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload / body size limit ──────────────────────────────────────────────
    client_max_body_size 50M;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Streaming / SSE support
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── Frontend static files ─────────────────────────────────────────────────
    root /opt/mystics/artifacts/erp/dist/public;
    index index.html;

    # Cache fingerprinted assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes → SPA index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Local file uploads (only relevant when STORAGE_BACKEND=local) ─────────
    # Files stored at /opt/mystics/data/uploads are served through the API proxy
    # above (/api/storage/objects/...) — no direct Nginx access needed.

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript text/xml application/xml application/rss+xml
               image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
}
